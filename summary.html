<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gut Check - Summary</title>
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" href="lib/pico.css">
        <link rel="stylesheet" href="lib/pico.colors.css">
        <link rel="stylesheet" href="styles/site.css">
        <meta name="theme-color" content="#000000">
    </head>
    <body>
        <div class="pinned-alert-container" id="alerts-container"></div>
        <div class="container">
            <nav>
                <ul>
                    <li>
                        <img src="img/icon192.png" alt="Gut Check Logo" width="32" height="32">
                        <strong>Gut Check</strong>
                    </li>
                </ul>
                <ul>
                    <li>
                        <button class="outline" onclick="window.location.href='index.html'">
                            🍎 <span class="hide-on-mobile">Track Food</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="window.location.href='summary.html'">
                            📊 <span class="hide-on-mobile">Summary</span>
                        </button>
                    </li>
                    <li>
                        <button class="contrast" id="theme-toggle-btn">☀️</button>
                    </li>
                </ul>
            </nav>
            <article>
                <h1>Summary</h1>
                <section>
                    <canvas id="healthChart" width="400" height="200"></canvas>
                </section>
                <section>
                    <details>
                    <summary role="button">Records</summary>
                    <p>
                        <table class="striped">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Food</th>
                                    <th>Score</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="summary-tbody">
                                
                            </tbody>
                        </table>
                    </p>
                    </details>
                </section>
            </article>
        </div>
        <script src="lib/chart.js"></script>
        <script src="lib/idb.js"></script>
        <script src="src/FoodChoicesRepo.js"></script>
        <script src="src/Alerts.js"></script>
        <script src="src/UserSettings.js"></script>
        <script src="src/summary.js"></script>
    </body>
    <footer>
        <div class="container">
            <article>
                <strong>💡Note</strong>
                <hr/>
                <span>All data is stored locally on device through your browser. Clearing this site's data <strong>will delete</strong> all of your food records.</span>
                <br/>
            </article>
        </div>
    </footer>
</html>
