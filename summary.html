<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gut Check - Summary</title>
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" href="lib/pico.css">
        <link rel="stylesheet" href="lib/pico.colors.css">
        <link rel="stylesheet" href="styles/site.css">
        <meta name="theme-color" content="#000000">
    </head>
    <body>
        <div class="pinned-alert-container" id="alerts-container"></div>
        <div class="container">
            <nav>
                <ul>
                    <li>
                        <img src="img/icon192.png" alt="Gut Check Logo" width="32" height="32">
                        <strong>Gut Check</strong>
                    </li>
                </ul>
                <ul>
                    <li>
                        🍎
                        <a href="index.html">
                            Track Food
                        </a>
                    </li>
                </ul>
                <ul>
                    <li>
                        📊
                        <a href="summary.html">
                            Summary
                        </a>
                    </li>
                </ul>
            </nav>
            <article>
                <h1>Summary</h1>
                <section>
                    <canvas id="healthChart" width="400" height="200"></canvas>
                </section>
                <section>
                    <details>
                    <summary role="button">Records</summary>
                    <p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>Date</th>
                                    <th>Food Choice</th>
                                    <th>Health Score</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="summary-tbody">
                                
                            </tbody>
                        </table>
                    </p>
                    </details>
                </section>
            </article>
        </div>
        <script src="lib/chart.js"></script>
        <script src="lib/idb.js"></script>
        <script src="src/FoodChoicesRepo.js"></script>
        <script src="src/Alerts.js"></script>
        <script src="src/summary.js"></script>
    </body>
    <footer>
        <div class="container">
            <article>
                <span>💡All data is stored locally on device through your browser. Clearing this site's data <strong>will delete</strong> all your food records.</span>
            </article>
        </div>
    </footer>
</html>
